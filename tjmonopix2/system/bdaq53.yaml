
---
name    : tjmonopix2-daq
version : 0.1.0

transfer_layer:
  - name  : intf
    type  : SiTcp
    init:
        ip : "192.168.10.23"
        udp_port : 4660
        tcp_port : 24
        tcp_connection : True

hw_drivers:
  - name      : FIFO
    type      : sitcp_fifo
    interface : intf
    base_addr : 0x200000000
    base_data_addr : 0x100000000

  - name      : i2c
    type      : i2c
    interface : intf
    base_addr : 0x4000

  - name      : system
    type      : tjmonopix2.system.board
    interface : intf
    base_addr : 0x0300

  - name      : gpio_daq_control
    type      : gpio
    interface : intf
    base_addr : 0x0500
    size      : 17

  - name      : gpio_xadc_vpvn
    type      : gpio
    interface : intf
    base_addr : 0x0900
    size      : 16

  - name      : gpio_xadc_fpga_temp
    type      : gpio
    interface : intf
    base_addr : 0x0A00
    size      : 16

  - name      : tlu
    type      : tlu
    interface : intf
    base_addr : 0x0600

  - name      : tdc
    type      : tdc_s3
    interface : intf
    base_addr : 0x0700

  - name      : tlu_veto
    type      : pulse_gen
    interface : intf
    base_addr : 0x0800
  
  - name      : pulser_cmd_start_loop
    type      : pulse_gen
    interface : intf
    base_addr : 0x0C00

  - name      : cmd
    type      : tjmonopix2.system.cmd
    interface : intf
    base_addr : 0x2000

registers:
  - name        : DAQ_CONTROL
    type        : StdRegister
    hw_driver   : gpio_daq_control
    size        : 17
    fields:
      - name    : TRIGGER_CLK_SEL
        size    : 1
        offset  : 16
      - name    : MGT_REF_SEL
        size    : 1
        offset  : 15
      - name    : LEMO_MUX_TX1
        size    : 2
        offset  : 14
      - name    : LEMO_MUX_TX0
        size    : 2
        offset  : 12
      - name    : LEMO_MUX_RX1
        size    : 2
        offset  : 10
      - name    : LEMO_MUX_RX0
        size    : 2
        offset  : 8
      - name    : NTC_MUX
        size    : 3
        offset  : 6
      - name    : SENSE
        size    : 4
        offset  : 3
